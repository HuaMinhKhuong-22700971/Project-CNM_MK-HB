<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8202c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)" rx="16"/>
  <!-- Laptop body base -->
  <rect x="80" y="270" width="440" height="20" rx="4" fill="rgba(0,0,0,0.4)"/>
  <!-- Laptop screen/lid -->
  <rect x="100" y="70" width="400" height="240" rx="10" fill="#1a1a1a" stroke="#e8202c" stroke-width="2"/>
  <!-- Screen content -->
  <rect x="116" y="84" width="368" height="212" rx="4" fill="url(#screen)"/>
  <!-- Brand text on screen -->
  <text x="300" y="165" font-family="Arial Black,sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="middle" opacity="0.9">Lenovo</text>
  <text x="300" y="198" font-family="Arial,sans-serif" font-size="16" fill="#e8202c" text-anchor="middle">ThinkPad X1</text>
  <!-- Specs -->
  <text x="300" y="225" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">Intel Core i7-8550U · 16GB LPDDR3</text>
  <text x="300" y="247" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">WQHD 14" IPS · Intel UHD 620</text>
  <text x="300" y="269" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">512GB NVMe SSD · MIL-SPEC 810G</text>
  <!-- Laptop keyboard base -->
  <rect x="86" y="282" width="428" height="14" rx="4" fill="#2a2a2a" stroke="#e8202c" stroke-width="1"/>
  <!-- Keyboard keys suggestion -->
  <rect x="130" y="285" width="340" height="8" rx="2" fill="#e8202c" opacity="0.15"/>
  <!-- Touchpad -->
  <rect x="240" y="287" width="120" height="6" rx="3" fill="#e8202c" opacity="0.2"/>
</svg>