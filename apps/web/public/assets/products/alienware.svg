<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ccff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)" rx="16"/>
  <!-- Laptop body base -->
  <rect x="80" y="270" width="440" height="20" rx="4" fill="rgba(0,0,0,0.4)"/>
  <!-- Laptop screen/lid -->
  <rect x="100" y="70" width="400" height="240" rx="10" fill="#1a1a1a" stroke="#00ccff" stroke-width="2"/>
  <!-- Screen content -->
  <rect x="116" y="84" width="368" height="212" rx="4" fill="url(#screen)"/>
  <!-- Brand text on screen -->
  <text x="300" y="165" font-family="Arial Black,sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="middle" opacity="0.9">Alienware</text>
  <text x="300" y="198" font-family="Arial,sans-serif" font-size="16" fill="#00ccff" text-anchor="middle">Area-15</text>
  <!-- Specs -->
  <text x="300" y="225" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">Intel Core i7-8750H · 32GB DDR4</text>
  <text x="300" y="247" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">FHD 144Hz · NVIDIA GTX 1070 8GB</text>
  <text x="300" y="269" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">1TB NVMe SSD · AlienFX RGB</text>
  <!-- Laptop keyboard base -->
  <rect x="86" y="282" width="428" height="14" rx="4" fill="#2a2a2a" stroke="#00ccff" stroke-width="1"/>
  <!-- Keyboard keys suggestion -->
  <rect x="130" y="285" width="340" height="8" rx="2" fill="#00ccff" opacity="0.15"/>
  <!-- Touchpad -->
  <rect x="240" y="287" width="120" height="6" rx="3" fill="#00ccff" opacity="0.2"/>
</svg>